<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>给蒋伯架 · 烟花弹窗</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #0a0c12;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      /* 深色渐变天空背景，更适合烟花 */
      background: radial-gradient(ellipse at 20% 30%, #1a1e2b 0%, #0b0d14 80%);
    }

    /* 烟花画布 — 全屏底层 */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== 开场火柴动画（保留原样但微调适配深色） ===== */
    .match-start {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }

    .match-start.hide {
      opacity: 0;
      pointer-events: none;
    }

    .match {
      position: relative;
      width: 140px;
      height: 12px;
      background: linear-gradient(90deg, #d7b27a, #b78543);
      border-radius: 2px;
      transform: rotate(-8deg);
      transform-origin: left center;
      animation: strike 1.1s cubic-bezier(0.4, 0.2, 0.3, 1) forwards;
    }

    .match::before {
      content: "";
      position: absolute;
      left: -10px;
      top: -4px;
      width: 18px;
      height: 20px;
      background: #2b2b2b;
      border-radius: 4px 2px 2px 4px;
    }

    .flame {
      position: absolute;
      right: -22px;
      top: -18px;
      width: 40px;
      height: 46px;
      background: radial-gradient(circle at 50% 85%, #fff7c2 0%, #ffcf5c 25%, #ff8a3d 55%, rgba(255, 80, 20, 0) 75%);
      border-radius: 50% 50% 45% 45%;
      opacity: 0;
      transform: scale(0.2);
      transform-origin: 50% 90%;
      animation: flame 1.3s ease-out 0.35s forwards;
      filter: blur(0.4px);
    }

    .glow {
      position: absolute;
      right: -90px;
      top: -80px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 170, 70, 0.55) 0%, rgba(255, 120, 30, 0.18) 40%, rgba(255, 120, 30, 0) 70%);
      border-radius: 50%;
      opacity: 0;
      animation: glow 1.4s ease-out 0.4s forwards;
    }

    .match-title {
      margin-top: 40px;
      color: #fff;
      font-size: 22px;
      letter-spacing: 6px;
      opacity: 0;
      text-shadow: 0 0 18px rgba(255, 170, 70, 0.85);
      animation: fadeInText 1.2s ease-out 1.1s forwards;
      position: relative;
      z-index: 1;
    }

    .match-hint {
      margin-top: 14px;
      color: rgba(255, 220, 170, 0.75);
      font-size: 13px;
      letter-spacing: 3px;
      opacity: 0;
      animation: fadeInText 1s ease-out 1.6s forwards;
      position: relative;
      z-index: 1;
    }

    @keyframes strike {
      0% { transform: rotate(-50deg) translateX(-60px); }
      60% { transform: rotate(10deg) translateX(10px); }
      100% { transform: rotate(-8deg) translateX(0); }
    }

    @keyframes flame {
      0% { opacity: 0; transform: scale(0.2); }
      40% { opacity: 1; transform: scale(1.15); }
      70% { transform: scale(0.9); }
      100% { opacity: 0.95; transform: scale(1); }
    }

    @keyframes glow {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 弹窗样式（半透玻璃感，在深色背景上更清晰） ===== */
    .popup {
      position: fixed;
      width: 280px;
      max-width: 86vw;
      height: auto;
      min-height: 86px;
      padding: 14px 16px;
      background: rgba(20, 24, 36, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 210, 140, 0.35);
      border-radius: 14px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.65),
        0 0 30px rgba(255, 180, 80, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.38s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 10;
    }

    .popup p {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
      color: #f5e9d8;
      text-align: center;
      letter-spacing: 0.5px;
      word-break: break-word;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    @keyframes popIn {
      from { transform: scale(0.72); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes popOut {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(0.82); opacity: 0; }
    }

    /* 烟花画布上的额外装饰光晕 — 不干扰交互 */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 140vmax;
      height: 140vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 50% 50%, rgba(255, 190, 80, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- 烟花画布 -->
  <canvas id="fireworksCanvas"></canvas>
  <div class="ambient-glow"></div>

  <!-- 开场划火柴 -->
  <div class="match-start" id="matchStart">
    <div class="match">
      <div class="flame"></div>
      <div class="glow"></div>
    </div>
    <div class="match-title">火光之下，句句真心</div>
    <div class="match-hint">点击屏幕继续</div>
  </div>

  <script>
    // ===================== 烟花引擎 =====================
    (function() {
      const canvas = document.getElementById('fireworksCanvas');
      const ctx = canvas.getContext('2d');
      let W = window.innerWidth;
      let H = window.innerHeight;

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
      }
      window.addEventListener('resize', resize);
      resize();

      // 粒子池
      const particles = [];
      // 烟花火箭（上升段）
      const rockets = [];

      // 配色方案（温暖绚丽）
      const palettes = [
        ['#FFD966', '#FFB347', '#FF8C42', '#FFA07A', '#FFC0CB'],
        ['#FFDAB9', '#FFB6C1', '#FF7F50', '#FFE4B5', '#FF69B4'],
        ['#FFE5B4', '#FFD700', '#FFA500', '#FF8C00', '#FF6347'],
        ['#FFFACD', '#FFDAB9', '#FFB6C1', '#FFA07A', '#FF7F50'],
        ['#E0FFFF', '#AFEEEE', '#FFDAB9', '#FFB6C1', '#FFA07A']
      ];

      // 随机取一个调色板
      function randomPalette() {
        return palettes[Math.floor(Math.random() * palettes.length)];
      }

      // ---- 火箭类 ----
      class Rocket {
        constructor(x, targetY) {
          this.x = x;
          this.y = H + 10;           // 从底部升起
          this.targetY = targetY;    // 目标爆炸高度
          this.vx = (Math.random() - 0.5) * 0.6;
          this.vy = -(Math.random() * 5 + 7); // 上升速度
          this.gravity = 0.08;
          this.palette = randomPalette();
          this.trail = [];           // 尾迹点
          this.exploded = false;
          this.fuse = 0;
        }

        update() {
          if (this.exploded) return;

          // 轻微横向漂移
          this.x += this.vx;
          this.y += this.vy;
          this.vy += this.gravity;

          // 尾迹记录
          if (Math.random() < 0.6) {
            this.trail.push({
              x: this.x + (Math.random() - 0.5) * 4,
              y: this.y + (Math.random() - 0.5) * 4,
              life: 1,
              color: this.palette[Math.floor(Math.random() * this.palette.length)]
            });
          }

          // 尾迹粒子衰减
          for (let i = this.trail.length - 1; i >= 0; i--) {
            this.trail[i].life -= 0.035;
            if (this.trail[i].life <= 0) this.trail.splice(i, 1);
          }

          // 接近目标高度或速度接近0时爆炸
          if (this.y <= this.targetY || this.vy >= -0.8) {
            this.explode();
          }
        }

        explode() {
          this.exploded = true;
          const count = 60 + Math.floor(Math.random() * 40);
          const baseSpeed = 2.2 + Math.random() * 2.2;
          const palette = this.palette;

          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = baseSpeed * (0.5 + Math.random() * 0.9);
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            const color = palette[Math.floor(Math.random() * palette.length)];
            // 添加少量白色/浅色高光粒子
            const isSparkle = Math.random() < 0.18;
            particles.push({
              x: this.x,
              y: this.y,
              vx: vx,
              vy: vy,
              life: 1,
              decay: 0.012 + Math.random() * 0.02,
              color: isSparkle ? '#FFFFFF' : color,
              size: 2 + Math.random() * 3,
              gravity: 0.06,
              flicker: Math.random() < 0.3,
            });
          }

          // 爆炸时额外的一圈亮闪
          for (let i = 0; i < 16; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.2 + Math.random() * 2.8;
            particles.push({
              x: this.x,
              y: this.y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 1,
              decay: 0.025,
              color: '#FFEDB0',
              size: 1.8 + Math.random() * 2,
              gravity: 0.05,
              flicker: false,
            });
          }
        }
      }

      // ---- 粒子更新与绘制 ----
      function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= 0.992;
          p.vy *= 0.992;
          p.life -= p.decay;

          // 闪烁效果
          if (p.flicker && Math.random() < 0.15) {
            p.life -= 0.04;
          }

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          // 绘制粒子
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.beginPath();
          const radius = p.size * (0.8 + 0.4 * Math.sin(Date.now() * 0.02 + i));
          ctx.arc(p.x, p.y, Math.max(0.5, radius), 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 12;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }

      // ---- 火箭绘制 ----
      function drawRockets() {
        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.update();

          // 绘制尾迹
          for (let t of r.trail) {
            ctx.globalAlpha = t.life * 0.7;
            ctx.beginPath();
            ctx.arc(t.x, t.y, 1.8 * t.life, 0, Math.PI * 2);
            ctx.fillStyle = t.color;
            ctx.shadowColor = t.color;
            ctx.shadowBlur = 10;
            ctx.fill();
          }

          // 绘制火箭头
          if (!r.exploded) {
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.arc(r.x, r.y, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = '#FFE484';
            ctx.shadowColor = '#FFB347';
            ctx.shadowBlur = 18;
            ctx.fill();
          } else {
            // 已爆炸的火箭从列表中移除
            rockets.splice(i, 1);
          }
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }

      // ---- 主循环 ----
      function animate() {
        ctx.clearRect(0, 0, W, H);

        // 绘制所有粒子（烟花）
        updateParticles();

        // 绘制火箭
        drawRockets();

        requestAnimationFrame(animate);
      }

      // ---- 定时生成新烟花 ----
      function launchFirework() {
        // 随机发射位置（横向偏离中心）
        const x = W * (0.15 + Math.random() * 0.7);
        // 目标高度在屏幕上半部分
        const targetY = H * (0.15 + Math.random() * 0.35);
        rockets.push(new Rocket(x, targetY));
      }

      // 开始自动烟花
      let fireworkInterval = null;

      function startAutoFireworks() {
        if (fireworkInterval) clearInterval(fireworkInterval);
        // 初始立即发射几发
        for (let i = 0; i < 3; i++) {
          setTimeout(() => launchFirework(), i * 300);
        }
        fireworkInterval = setInterval(() => {
          launchFirework();
        }, 1100 + Math.random() * 900);
      }

      // 启动动画和烟花
      animate();
      startAutoFireworks();

      // 暴露全局方法以便外部控制（比如开始/停止）
      window.__fireworks = {
        launch: launchFirework,
        start: startAutoFireworks,
      };
    })();

    // ===================== 弹窗逻辑（保留原版，增强适配） =====================
    const messages = [
      "蒋伯架，我把这枚戒指留给你",
      "蒋伯架，我们去老派约会吧",
      "蒋伯架，天地之宽，出路万万千",
      "蒋伯架，我应该和你说一声对不起",
      "蒋伯架，你要照顾好自己，不要受伤",
      "蒋伯架，吃了水煮蛋，魂魄就不会被人抢走",
      "蒋生官仔骨骨，最适合危情共舞",
      "你是我永恒的平静",
      "蒋伯架，祝你生辰快乐，每一天都要快乐幸福",
      "蒋伯架，我们在相同的频道里",
      "蒋伯架，我们一起去看荧光海吧",
      "蒋伯架，我们一起去淋雨吧",
      "蒋伯架，我们一起回广府的家吧",
      "蒋伯架，我爱你～"
    ];

    const finalMessage = "蒋伯架，我们来日方长";
    const popupInterval = 620;
    const popupDuration = 3400;

    function createPopup(text) {
      const popup = document.createElement("div");
      popup.className = "popup";

      const p = document.createElement("p");
      p.textContent = text;
      popup.appendChild(p);

      const marginX = 40;
      const marginY = 60;
      // 弹窗宽度按最大280估算
      const maxX = Math.max(window.innerWidth - 280 - marginX, marginX);
      const maxY = Math.max(window.innerHeight - 120 - marginY, marginY);
      const x = Math.floor(Math.random() * (maxX - marginX)) + marginX;
      const y = Math.floor(Math.random() * (maxY - marginY)) + marginY;

      popup.style.left = x + "px";
      popup.style.top = y + "px";

      document.body.appendChild(popup);

      setTimeout(() => {
        popup.style.animation = "popOut 0.32s ease-in forwards";
        setTimeout(() => popup.remove(), 340);
      }, popupDuration);
    }

    function startMessages() {
      // 弹窗出现时，烟花保持动态
      messages.forEach((msg, index) => {
        setTimeout(() => createPopup(msg), index * popupInterval);
      });

      // 最终弹窗
      setTimeout(() => {
        createPopup(finalMessage);
        // 最终弹窗出现后，烟花可以更密集一些（但不强制）
        if (window.__fireworks) {
          // 额外多发射几发庆祝
          for (let i = 0; i < 6; i++) {
            setTimeout(() => window.__fireworks.launch(), i * 250);
          }
        }
      }, messages.length * popupInterval + 900);
    }

    const matchStart = document.getElementById("matchStart");

    matchStart.addEventListener("click", () => {
      matchStart.classList.add("hide");
      setTimeout(() => {
        matchStart.style.display = "none";
        startMessages();
      }, 700);
    });

    // 页面加载完成后，如果用户没点击，背景烟花也一直在跑
    // 为了让火柴动画更清晰，我们保留黑色遮罩，但烟花已经在背景运行。
    // 用户点击后，黑色遮罩消失，烟花可见。
    // 但是注意：火柴动画层是z-index:999，会盖住烟花。点击后隐藏即可。
    // 为了让用户点击前有准备，不需要额外操作。
  </script>
</body>
</html>
